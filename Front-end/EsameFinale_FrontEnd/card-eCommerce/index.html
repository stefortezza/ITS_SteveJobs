<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card E-Commerce</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <article class="productCard">
            <section class="productImage">
                <button class="icons">♡</button>
                <div class="bgImg"></div>
                <div class="badges">
                    <button class="badge code">CAMBIO20</button>
                    <button class="badge promo">Promo</button>
                </div>
            </section>

            <section class="productInfo">
                <h2 class="brand">Calvin Klein</h2>
                <p class="name">Sneakers basse - off white/navy</p>
                <div class="price">76,99 €</div>
                <p class="priceMedian">
                    Prezzo mediano:
                    <span class="old-price">109,99 €</span>
                    <span class="discount">-30%</span>
                </p>
            </section>

        </article>

    </main>

</body>

</html>
